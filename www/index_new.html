<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>PopGo</title>
    
    <!-- Mobile optimization -->
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="PopGo">
    <meta name="theme-color" content="#0a0d21">
    <meta name="description" content="PopGo - Eğlenceli ve modern balon patlatma oyunu. Üç farklı oyun modu ile keyifli vakit geçirin!">
    <meta name="keywords" content="popgo, balon patlatma, oyun, eğlence, puzzle, mobile game">
    
    <!-- Apple Touch Icons -->
    <link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='balloonGrad' x1='0%25' y1='0%25' x2='100%25' y2='100%25'%3E%3Cstop offset='0%25' stop-color='%23ff4081'/%3E%3Cstop offset='100%25' stop-color='%23ff9800'/%3E%3C/linearGradient%3E%3C/defs%3E%3Ccircle cx='32' cy='24' r='16' fill='url(%23balloonGrad)' stroke='%23fff' stroke-width='2'/%3E%3Cellipse cx='32' cy='24' rx='12' ry='14' fill='url(%23balloonGrad)' opacity='0.9'/%3E%3Cpath d='M32 40 Q32 45 32 50' stroke='%23ff4081' stroke-width='3' fill='none'/%3E%3Cpath d='M30 50 L34 50 L33 54 L31 54 Z' fill='%23ff4081'/%3E%3Ctext x='32' y='30' text-anchor='middle' fill='white' font-family='Arial' font-size='12' font-weight='bold'%3EP%3C/text%3E%3C/svg%3E">
    
    <!-- PopGo Modern Icon -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='balloonGrad' x1='0%25' y1='0%25' x2='100%25' y2='100%25'%3E%3Cstop offset='0%25' stop-color='%23ff4081'/%3E%3Cstop offset='100%25' stop-color='%23ff9800'/%3E%3C/linearGradient%3E%3C/defs%3E%3Ccircle cx='32' cy='24' r='16' fill='url(%23balloonGrad)' stroke='%23fff' stroke-width='2'/%3E%3Cellipse cx='32' cy='24' rx='12' ry='14' fill='url(%23balloonGrad)' opacity='0.9'/%3E%3Cpath d='M32 40 Q32 45 32 50' stroke='%23ff4081' stroke-width='3' fill='none'/%3E%3Cpath d='M30 50 L34 50 L33 54 L31 54 Z' fill='%23ff4081'/%3E%3Ctext x='32' y='30' text-anchor='middle' fill='white' font-family='Arial' font-size='12' font-weight='bold'%3EP%3C/text%3E%3C/svg%3E">
    
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <!-- PWA Manifest -->
    <link rel="manifest" href="manifest.json">
    
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Splash Screen -->
    <div id="splash-screen">
        <div class="splash-bg-particles"></div>
        <div class="splash-content">
            <div class="splash-logo">
                <div class="teknova-logo">
                    <div class="logo-text gradient-text">Teknova</div>
                    <div class="logo-subtitle">
                        <span>Game Labs</span>
                        <i class="fas fa-flask"></i>
                    </div>
                    <svg width="500" height="120" viewBox="0 0 500 120" fill="none" xmlns="http://www.w3.org/2000/svg" class="circuit-board">
                        <defs>
                            <linearGradient id="circuit-gradient" x1="0" y1="0" x2="500" y2="0" gradientUnits="userSpaceOnUse">
                                <stop stop-color="#3a8dde"/>
                                <stop offset="0.5" stop-color="#7b1fa2"/>
                                <stop offset="1" stop-color="#00eaff"/>
                            </linearGradient>
                            <radialGradient id="circuit-gradient-node" cx="0.5" cy="0.5" r="0.5" fx="0.5" fy="0.5">
                                <stop stop-color="#00eaff"/>
                                <stop offset="1" stop-color="#7b1fa2"/>
                            </radialGradient>
                        </defs>
                        
                        <!-- Circuit paths -->
                        <path d="M50 60 L120 60 L120 40 L200 40" stroke="url(#circuit-gradient)" stroke-width="2" fill="none" class="circuit-path">
                            <animate attributeName="stroke-dashoffset" values="100;0" dur="2s" repeatCount="indefinite"/>
                        </path>
                        <path d="M50 60 L120 60 L120 80 L200 80" stroke="url(#circuit-gradient)" stroke-width="2" fill="none" class="circuit-path">
                            <animate attributeName="stroke-dashoffset" values="80;0" dur="1.8s" repeatCount="indefinite"/>
                        </path>
                        <path d="M300 40 L380 40 L380 60 L450 60" stroke="url(#circuit-gradient)" stroke-width="2" fill="none" class="circuit-path">
                            <animate attributeName="stroke-dashoffset" values="90;0" dur="2.2s" repeatCount="indefinite"/>
                        </path>
                        <path d="M300 80 L380 80 L380 60" stroke="url(#circuit-gradient)" stroke-width="2" fill="none" class="circuit-path">
                            <animate attributeName="stroke-dashoffset" values="70;0" dur="1.5s" repeatCount="indefinite"/>
                        </path>
                        
                        <!-- Circuit nodes -->
                        <circle cx="50" cy="60" r="3" fill="url(#circuit-gradient-node)" class="circuit-node"/>
                        <circle cx="120" cy="40" r="3" fill="url(#circuit-gradient-node)" class="circuit-node"/>
                        <circle cx="120" cy="80" r="3" fill="url(#circuit-gradient-node)" class="circuit-node"/>
                        <circle cx="200" cy="40" r="3" fill="url(#circuit-gradient-node)" class="circuit-node"/>
                        <circle cx="200" cy="80" r="3" fill="url(#circuit-gradient-node)" class="circuit-node"/>
                        <circle cx="300" cy="40" r="3" fill="url(#circuit-gradient-node)" class="circuit-node"/>
                        <circle cx="300" cy="80" r="3" fill="url(#circuit-gradient-node)" class="circuit-node"/>
                        <circle cx="380" cy="60" r="3" fill="url(#circuit-gradient-node)" class="circuit-node"/>
                        <circle cx="450" cy="60" r="3" fill="url(#circuit-gradient-node)" class="circuit-node"/>
                    </svg>
                </div>
            </div>
            <div class="loading-bar">
                <div class="loading-fill"></div>
            </div>
            <div class="loading-text">Yükleniyor...</div>
        </div>
    </div>

    <div id="game-root" style="visibility: hidden;">
        <canvas id="gameCanvas"></canvas>

        <!-- Modern Hamburger Menü Sistemi -->
        <div id="gameHUD" class="game-hud">
            <!-- Top Bar with Menu Button -->
            <div class="top-bar">
                <button id="menuToggle" class="hamburger-btn">
                    <span></span>
                    <span></span>
                    <span></span>
                </button>
                <div class="game-info">
                    <span id="score" class="score-display">Skor: 0</span>
                </div>
            </div>

            <!-- Overlay Menu -->
            <div id="overlayMenu" class="overlay-menu">
                <div class="menu-content">
                    <button class="close-menu" id="closeMenu">&times;</button>
                    
                    <div class="menu-section">
                        <h3>🎮 Oyun Kontrolleri</h3>
                        <button id="startGameBtn" class="menu-btn primary">
                            <i class="fas fa-play"></i>
                            Oyunu Başlat
                        </button>
                        <button id="restartButton" class="menu-btn restart" style="display:none;">
                            <i class="fas fa-redo"></i>
                            Tekrar Oyna
                        </button>
                    </div>

                    <div class="menu-section">
                        <h3>📊 İstatistikler</h3>
                        <div class="stats-grid">
                            <div class="stat-card">
                                <span class="stat-icon">🏆</span>
                                <div>
                                    <span class="stat-label">En Yüksek</span>
                                    <span class="stat-value" id="highScore">0</span>
                                </div>
                            </div>
                            <div class="stat-card">
                                <span class="stat-icon">💥</span>
                                <div>
                                    <span class="stat-label">Patlatılan</span>
                                    <span class="stat-value" id="totalPopped">0</span>
                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="menu-section">
                        <h3>⚡ Güç-ups</h3>
                        <div class="powerups-grid">
                            <button class="powerup-btn" onclick="usePowerup('rainbow')">
                                <span class="powerup-icon">🎯</span>
                                <span class="powerup-name">Rainbow</span>
                                <span class="powerup-count" id="rainbowCount">0</span>
                            </button>
                            <button class="powerup-btn" onclick="usePowerup('fireball')">
                                <span class="powerup-icon">🔥</span>
                                <span class="powerup-name">Fireball</span>
                                <span class="powerup-count" id="fireballCount">0</span>
                            </button>
                        </div>
                    </div>

                    <div class="menu-section">
                        <h3>⚙️ Ayarlar</h3>
                        <div class="settings-items">
                            <div class="setting-item">
                                <label>🔊 Ses: <span id="soundValue">70</span>%</label>
                                <input type="range" id="soundVolume" min="0" max="100" value="70">
                            </div>
                            <div class="setting-item">
                                <label>🎵 Müzik: <span id="musicValue">50</span>%</label>
                                <input type="range" id="musicVolume" min="0" max="100" value="50">
                            </div>
                            <div class="setting-item">
                                <label>📳 Titreşim</label>
                                <input type="checkbox" id="vibrationEnabled" checked>
                            </div>
                        </div>
                        <div class="action-buttons">
                            <button id="exportDataButton" class="menu-btn secondary">📥 Verileri İndir</button>
                            <button id="resetDataButton" class="menu-btn danger">🗑️ Sıfırla</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div id="startScreen">
            <h1 class="game-title">PopGo</h1>
            <div class="icon-container">
                <div class="logo-icon">
                    <i class="fas fa-circle" style="color: #ff4081; font-size: 3rem; position: relative;">
                        <span style="position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); font-size: 1.2rem; color: white; font-weight: bold;">P</span>
                    </i>
                </div>
                <span class="balloon-icon">🎈</span>
                <span class="balloon-icon">🎈</span>
                <span class="balloon-icon">🎈</span>
            </div>
            
            <!-- Oyun Modu Seçimi -->
            <div class="game-mode-selection">
                <h3>Oyun Modu Seç:</h3>
                <div class="mode-buttons">
                    <button class="mode-btn active" data-mode="classic">
                        <span class="mode-icon">🎯</span>
                        <div class="mode-info">
                            <strong>Klasik</strong>
                            <small>Sınırsız hamle</small>
                        </div>
                    </button>
                    <button class="mode-btn" data-mode="strategy">
                        <span class="mode-icon">🧠</span>
                        <div class="mode-info">
                            <strong>Strateji</strong>
                            <small>60 hamle sınırı</small>
                        </div>
                    </button>
                    <button class="mode-btn" data-mode="arcade">
                        <span class="mode-icon">⚡</span>
                        <div class="mode-info">
                            <strong>Arcade</strong>
                            <small>5 dakika süre</small>
                        </div>
                    </button>
                </div>
            </div>
            
            <button id="startButton">Başla</button>
        </div>
    </div>

    <!-- TAM EKRAN BİTİŞ EKRANI -->
    <div id="endScreen" class="modal-overlay" style="display:none;">
        <div class="end-content">
            <h1 id="endTitle">Oyun Bitti</h1>
            <p id="endSubtitle">Skorunuz: <span id="finalScore">0</span></p>
            <button id="endRestartButton">Tekrar Oyna</button>
        </div>
    </div>

    <!-- İstatistik Modal -->
    <div id="statsModal" class="modal-overlay" style="display:none;">
        <div class="stats-content">
            <h2>📊 Oyuncu İstatistikleri</h2>
            <div id="statsDetails"></div>
            <div class="stats-actions">
                <button id="exportDataButton">📥 Verileri İndir</button>
                <button id="resetDataButton">🗑️ Sıfırla</button>
                <button id="closeStatsButton">Kapat</button>
            </div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/chroma-js/2.4.2/chroma.min.js"></script>
    <script src="splash-screen.js"></script>
    <script src="app.js" type="module"></script>

    <script>
        // Hamburger Menü JavaScript'i
        document.addEventListener('DOMContentLoaded', function() {
            const menuToggle = document.getElementById('menuToggle');
            const closeMenu = document.getElementById('closeMenu');
            const overlayMenu = document.getElementById('overlayMenu');
            
            // Menü açma/kapama
            function toggleMenu() {
                menuToggle.classList.toggle('active');
                overlayMenu.classList.toggle('open');
            }
            
            menuToggle.addEventListener('click', toggleMenu);
            closeMenu.addEventListener('click', toggleMenu);
            
            // Menü dışına tıklandığında kapat
            overlayMenu.addEventListener('click', function(e) {
                if (e.target === overlayMenu) {
                    toggleMenu();
                }
            });
            
            // Range inputlar için gerçek zamanlı değer güncelleme
            const soundVolume = document.getElementById('soundVolume');
            const soundValue = document.getElementById('soundValue');
            const musicVolume = document.getElementById('musicVolume');
            const musicValue = document.getElementById('musicValue');
            
            soundVolume.addEventListener('input', function() {
                soundValue.textContent = this.value;
            });
            
            musicVolume.addEventListener('input', function() {
                musicValue.textContent = this.value;
            });
        });

        // Splash Screen başlatma
        const splash = new TeknovaSplashScreen({
            duration: 3000,
            onComplete: () => {
                document.getElementById('game-root').style.visibility = 'visible';
            }
        });
        splash.init();

        // Basit bir PWA kurulumunun parçası olarak service worker kaydı
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('service-worker.js')
                    .catch(err => console.error('Service Worker kaydı başarısız:', err));
            });
        }
    </script>
</body>
</html>
