<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 568" style="background-color: #0a0d21;">
  <defs>
    <!-- Arkaplan Gradyanı -->
    <radialGradient id="bgGradient" cx="50%" cy="40%" r="80%">
      <stop offset="0%" stop-color="#1e61ff" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#0a0d21" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#000000"/>
    </radialGradient>
    
    <!-- Logo Gradyanı -->
    <linearGradient id="logoGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00e5ff"/>
      <stop offset="50%" stop-color="#1e61ff"/>
      <stop offset="100%" stop-color="#7b1fa2"/>
    </linearGradient>
    
    <!-- Balon Gradyanları -->
    <linearGradient id="redBalloon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff4081"/>
      <stop offset="100%" stop-color="#ff1744"/>
    </linearGradient>
    
    <linearGradient id="blueBalloon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00e5ff"/>
      <stop offset="100%" stop-color="#007bff"/>
    </linearGradient>
    
    <linearGradient id="greenBalloon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#76ff03"/>
      <stop offset="100%" stop-color="#00c851"/>
    </linearGradient>
    
    <linearGradient id="yellowBalloon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffd600"/>
      <stop offset="100%" stop-color="#ff9800"/>
    </linearGradient>
    
    <!-- Parlaklık Efekti -->
    <radialGradient id="sparkEffect" cx="30%" cy="30%" r="40%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#00eaff" stop-opacity="0.2"/>
    </radialGradient>
    
    <!-- Animasyon efekti -->
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00eaff" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#00eaff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  
  <!-- Arkaplan -->
  <rect width="320" height="568" fill="url(#bgGradient)"/>
  
  <!-- Parçacık Efektleri -->
  <g opacity="0.6">
    <circle cx="50" cy="80" r="1.5" fill="#00eaff" opacity="0.8">
      <animate attributeName="opacity" values="0.8;0.3;0.8" dur="2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="280" cy="120" r="1" fill="#ffffff" opacity="0.6">
      <animate attributeName="opacity" values="0.6;0.2;0.6" dur="3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="30" cy="200" r="1.2" fill="#76ff03" opacity="0.7">
      <animate attributeName="opacity" values="0.7;0.3;0.7" dur="2.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="290" cy="250" r="1" fill="#ff4081" opacity="0.5">
      <animate attributeName="opacity" values="0.5;0.1;0.5" dur="3.5s" repeatCount="indefinite"/>
    </circle>
  </g>
  
  <!-- Ana Logo ve Başlık -->
  <g transform="translate(160, 200)">
    <!-- Logo Arkası Glow -->
    <circle cx="0" cy="0" r="80" fill="url(#glow)" opacity="0.4">
      <animate attributeName="r" values="70;90;70" dur="3s" repeatCount="indefinite"/>
    </circle>
    
    <!-- Ana Logo Dairesi -->
    <circle cx="0" cy="0" r="65" fill="url(#logoGradient)" stroke="#00eaff" stroke-width="3" opacity="0.9"/>
    
    <!-- PopGo Logo İçeriği -->
    <!-- Kırmızı Balon -->
    <circle cx="-20" cy="-15" r="12" fill="url(#redBalloon)" stroke="#fff" stroke-width="1.5" opacity="0.95"/>
    <circle cx="-20" cy="-15" r="8" fill="url(#sparkEffect)" opacity="0.7"/>
    
    <!-- Mavi Balon -->
    <circle cx="25" cy="-20" r="10" fill="url(#blueBalloon)" stroke="#fff" stroke-width="1.5" opacity="0.9"/>
    <circle cx="25" cy="-20" r="6" fill="url(#sparkEffect)" opacity="0.6"/>
    
    <!-- Yeşil Balon -->
    <circle cx="-25" cy="15" r="11" fill="url(#greenBalloon)" stroke="#fff" stroke-width="1.5" opacity="0.9"/>
    <circle cx="-25" cy="15" r="7" fill="url(#sparkEffect)" opacity="0.6"/>
    
    <!-- Sarı Balon -->
    <circle cx="20" cy="20" r="13" fill="url(#yellowBalloon)" stroke="#fff" stroke-width="1.5" opacity="0.95"/>
    <circle cx="20" cy="20" r="9" fill="url(#sparkEffect)" opacity="0.7"/>
    
    <!-- Pop Efekti (P Harfi) -->
    <circle cx="0" cy="35" r="15" fill="#1e61ff" stroke="#00eaff" stroke-width="2" opacity="0.9"/>
    <text x="0" y="42" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="white">P</text>
  </g>
  
  <!-- Oyun Başlığı -->
  <text x="160" y="320" text-anchor="middle" font-family="Arial, sans-serif" font-size="36" font-weight="bold" fill="url(#logoGradient)">PopGo</text>
  <text x="160" y="345" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#00eaff" opacity="0.8">Balon Patlatma Oyunu</text>
  
  <!-- Alt kısım bilgi -->
  <text x="160" y="480" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#ffffff" opacity="0.6">Teknova Game Labs</text>
  
  <!-- Yükleniyor animasyonu -->
  <g transform="translate(160, 420)">
    <circle cx="-20" cy="0" r="4" fill="#00eaff">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="1s" begin="0s" repeatCount="indefinite"/>
    </circle>
    <circle cx="0" cy="0" r="4" fill="#1e61ff">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="1s" begin="0.33s" repeatCount="indefinite"/>
    </circle>
    <circle cx="20" cy="0" r="4" fill="#7b1fa2">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="1s" begin="0.66s" repeatCount="indefinite"/>
    </circle>
  </g>
  
  <!-- Işıltı efektleri -->
  <g opacity="0.7">
    <path d="M40,100 L50,90" stroke="#ffffff" stroke-width="2" stroke-linecap="round" opacity="0.8">
      <animate attributeName="opacity" values="0.8;0.3;0.8" dur="4s" repeatCount="indefinite"/>
    </path>
    <path d="M280,150 L290,140" stroke="#ffffff" stroke-width="2" stroke-linecap="round" opacity="0.6">
      <animate attributeName="opacity" values="0.6;0.2;0.6" dur="3s" repeatCount="indefinite"/>
    </path>
    <path d="M60,400 L70,390" stroke="#ffffff" stroke-width="2" stroke-linecap="round" opacity="0.7">
      <animate attributeName="opacity" values="0.7;0.3;0.7" dur="2.5s" repeatCount="indefinite"/>
    </path>
  </g>
</svg> 