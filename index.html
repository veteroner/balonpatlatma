    <script>
        (function(){

                var platform = (window.Capacitor && typeof window.Capacitor.getPlatform === 'function')

    <div id="game-root" style="visibility: hidden;">
        <!-- Banner Reklam (Üst) - Devre Dışı -->
        <div id="topBannerAd" class="banner-ad top-banner" style="display: none;">
            <ins class="adsbygoogle"
                 style="display:block"
                 data-ad-client="ca-pub-7610338885240453"
                 data-ad-slot="1211356264"
                 data-ad-format="auto"
                 data-full-width-responsive="true"></ins>
        </div>

        <canvas id="gameCanvas"></canvas>

        <!-- Hamburger Menü -->
        <button id="menuToggle" class="hamburger-btn">
            <span></span>
            <span></span>
            <span></span>
        </button>

        <!-- Power Ball Buttons (Alt Banner Alanı) -->
        <div id="powerBallBar" class="power-ball-bar">
            <button id="bombBtn" class="power-ball-btn" onclick="usePowerBall('bomb')">
                <span class="power-icon">💣</span>
                <span class="power-count" id="bombCount">0</span>
            </button>
            
            <button id="laserBtn" class="power-ball-btn" onclick="usePowerBall('laser')">
                <span class="power-icon">🔷</span>
                <span class="power-count" id="laserCount">0</span>
            </button>
            
            <button id="fireballBtn" class="power-ball-btn" onclick="usePowerBall('fireball')">
                <span class="power-icon">🔥</span>
                <span class="power-count" id="fireballCount">0</span>
            </button>
            
            <button id="verticalLaserBtn" class="power-ball-btn" onclick="usePowerBall('verticalLaser')">
                <span class="power-icon">⚡</span>
                <span class="power-count" id="verticalLaserCount">0</span>
            </button>
            
            <button id="freezeBtn" class="power-ball-btn" onclick="usePowerBall('freeze')">
                <span class="power-icon">❄️</span>
                <span class="power-count" id="freezeCount">0</span>
            </button>
            
            <button id="rainbowBtn" class="power-ball-btn" onclick="usePowerBall('rainbow')">
                <span class="power-icon">🌈</span>
                <span class="power-count" id="rainbowCount">0</span>
            </button>
        </div>

        <!-- Power Ball Info Modal -->
        <div id="powerBallModal" class="power-ball-modal" style="display: none;">
            <div class="modal-backdrop"></div>
            <div class="modal-content">
                <div class="modal-icon" id="modalIcon">💣</div>
                <h2 class="modal-title" id="modalTitle">BOMBA</h2>
                <p class="modal-description" id="modalDescription">Çevresindeki tüm balonları patlatır</p>
                
                <button class="modal-ad-btn" id="modalAdBtn">
                    <span class="btn-icon">📺</span>
                    <span class="btn-text">Reklam İzle ve Kazanın</span>
                </button>
                
                <button class="modal-close-btn" id="modalCloseBtn">Kapat</button>
            </div>
        </div>

        <!-- Tam Ekran Reklam Container -->
        <div id="interstitialAdContainer" class="interstitial-ad-container" style="display: none;">
            <div class="interstitial-content">
                <div class="ad-close-timer">
                    <span id="adTimer">5</span> saniye sonra kapatabilirsiniz
                </div>
                <button id="closeInterstitialAd" class="close-ad-btn" style="display: none;">
                    <i class="fas fa-times"></i> Reklamı Kapat
                </button>
                <div id="interstitialAdSlot">
                    <ins class="adsbygoogle"
                         style="display:block"
                         data-ad-client="ca-pub-7610338885240453"
                         data-ad-slot="2144790251"
                         data-ad-format="interstitial"
                         data-full-width-responsive="true"></ins>
                </div>
            </div>
        </div>

        <!-- Power-up Tooltip -->
        <div id="powerupTooltip" class="powerup-tooltip" style="display: none;">
            <div class="tooltip-content">
                <h4 id="tooltipTitle"></h4>
                <p id="tooltipDescription"></p>
            </div>
        </div>

        <!-- Modern Hamburger Menü Sistemi -->
        <div id="gameHUD" class="game-hud">
            <!-- Ad Reward Button (Lava Ball) - Top Right Corner -->
            <button id="adRewardBtn" class="ad-reward-button" onclick="earnLavaBallWithAd()" style="display: none;">
                <span class="ad-icon">📺</span>
                <span class="reward-icon">🔥</span>
                <span class="reward-text">+1</span>
            </button>
            
            <!-- Top Bar with Menu Button -->
            <div class="top-bar">
                <div class="game-info">
                    <span id="score" class="score-display" style="display: none;">Skor: 0</span>
                </div>
            </div>

            <!-- Overlay Menu -->
            <div id="overlayMenu" class="overlay-menu">
                <div class="menu-content">
                    <button class="close-menu" id="closeMenu">&times;</button>
                    
                    <div class="menu-section">
                        <h3>🎮 Oyun Kontrolleri</h3>
                        <button id="startGameBtn" class="menu-btn primary">
                            <i class="fas fa-play"></i>
                            Oyunu Başlat
                        </button>
                        <button id="restartButton" class="menu-btn restart" style="display:none;">
                            <i class="fas fa-redo"></i>
                            Tekrar Oyna
                        </button>
                        <button id="howToPlayBtn" class="menu-btn secondary">
                            <i class="fas fa-question-circle"></i>
                            Nasıl Oynanır
                        </button>
                    </div>

                    <div class="menu-section">
                        <h3>📊 İstatistikler</h3>
                        <div class="stats-grid">
                            <div class="stat-card">
                                <span class="stat-icon">🏆</span>
                                <div>
                                    <span class="stat-label">En Yüksek</span>
                                    <span class="stat-value" id="highScore">0</span>
                                </div>
                            </div>
                            <div class="stat-card">
                                <span class="stat-icon">💥</span>
                                <div>
                                    <span class="stat-label">Patlatılan</span>
                                    <span class="stat-value" id="totalPopped">0</span>
                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="menu-section">
                        <h3>⚡ Güç-ups</h3>
                        <div class="powerups-grid">
                            <button class="powerup-btn" onclick="usePowerup('rainbow')">
                                <span class="powerup-icon">🎯</span>
                                <span class="powerup-name">Rainbow</span>
                                <span class="powerup-count" id="rainbowCount">0</span>
                            </button>
                            <button class="powerup-btn" onclick="usePowerup('fireball')">
                                <span class="powerup-icon">🔥</span>
                                <span class="powerup-name">Fireball</span>
                                <span class="powerup-count" id="fireballCount">0</span>
                            </button>
                        </div>
                    </div>

                    

                    <div class="menu-section">
                        <h3>⚙️ Ayarlar</h3>
                        <div class="settings-items">
                            <div class="setting-item">
                                <label>🔊 Ses: <span id="soundValue">70</span>%</label>
                                <input type="range" id="soundVolume" min="0" max="100" value="70">
                            </div>
                            <div class="setting-item">
                                <label>🎵 Müzik: <span id="musicValue">50</span>%</label>
                                <input type="range" id="musicVolume" min="0" max="100" value="50">
                            </div>
                            <div class="setting-item">
                                <label>📳 Titreşim</label>
                                <input type="checkbox" id="vibrationEnabled" checked>
                            </div>
                        </div>
                        <div class="action-buttons">
                            <button id="exportDataButton" class="menu-btn secondary">📥 Verileri İndir</button>
                            <button id="resetDataButton" class="menu-btn danger">🗑️ Sıfırla</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div id="startScreen">
            <h1 class="game-title"></h1>
            <div class="icon-container">
                                 <div class="neon-sign">

                         <span class="letter">P</span>
                         <span class="letter">G</span>
                         <span class="letter">O</span>
                     </div>
                 </div>
            </div>
            
            <!-- Oyun Modu Seçimi -->
            <div class="game-mode-selection">
                <h3>Oyun Modu Seç:</h3>

                    <button class="mode-btn active" data-mode="classic">
                        <span class="mode-icon">🎯</span>
                        <div class="mode-info">
                            <strong>Klasik</strong>
                            <small>Sınırsız hamle</small>

    <script>
        // Unity Ads Bridge'i hemen init et
        document.addEventListener('DOMContentLoaded', async function() {
            console.log('🔧 [UNITY] DOMContentLoaded - Unity Ads Bridge init başlatılıyor...');
            console.log('🔧 [UNITY] window.UnityAdsBridge exists:', !!window.UnityAdsBridge);
            console.log('🔧 [UNITY] window.Capacitor exists:', !!window.Capacitor);
            console.log('🔧 [UNITY] window.Capacitor.Plugins exists:', !!window.Capacitor?.Plugins);
            
            // Test: HTML JavaScript çalışıyor mu?
            console.log('🔧 [UNITY] HTML JS is working! UnityAdsBridge: ' + !!window.UnityAdsBridge);
            
            if (window.UnityAdsBridge) {
                try {
                    console.log('🔧 [UNITY] Calling UnityAdsBridge.init()...');
                    await window.UnityAdsBridge.init();

                    console.log('✅ [UNITY] isNativeReady:', window.UnityAdsBridge.isNativeReady);
                } catch (e) {

                }
            } else {

                console.error('❌ [UNITY] Available scripts:', document.querySelectorAll('script[src]'));
            }
        });
    </script>
    <script src="app.js"></script>

    <script>
        // Splash Screen başlatma - Android uyumlu versiyon
        function initializeSplashScreen() {
            console.log('🚀 Splash screen başlatılıyor...');
            
            const splash = new TeknovaSplashScreen({
                duration: 4000, // 4 saniye Teknova splash screen
                onComplete: () => {
                    console.log('✅ Teknova splash screen tamamlandı');
                    
                    // PopGo splash screen'i göster
                    showPopGoSplash();
                }
            });
            
            // Elementlerin hazır olup olmadığını kontrol et
            const checkSplashElements = () => {
                const splashScreen = document.getElementById('splash-screen');
                const loaderBar = document.querySelector('.splash-loader-bar');
                const loaderPercent = document.querySelector('.loader-percentage');
                
                if (splashScreen && loaderBar && loaderPercent) {
                    console.log('✅ Splash screen elementleri hazır');
                    splash.initSplashScreens();
                } else {
                    console.log('⏳ Splash screen elementleri bekleniyor...');
                    setTimeout(checkSplashElements, 100);
                }
            };
            
            // DOM hazır olduğunda veya hemen başlat
            if (document.readyState === 'loading') {
                document.addEventListener('DOMContentLoaded', checkSplashElements);
            } else {
                checkSplashElements();
            }
        }
        
        // PopGo Splash Screen Function
        function showPopGoSplash() {
            // PopGo splash screen elementi oluştur
            const popgoSplash = document.createElement('div');
            popgoSplash.id = 'popgo-splash';
            popgoSplash.innerHTML = `
                <div class="popgo-splash-content">
                    <div class="popgo-app-icon">
                        <div class="icon-circle">
                            <div class="balloon-small balloon-red-small"></div>
                            <div class="balloon-small balloon-blue-small"></div>
                            <div class="balloon-small balloon-green-small"></div>
                            <div class="balloon-small balloon-yellow-small"></div>
                            <div class="center-p">P</div>
                        </div>
                    </div>
                    <h1 class="popgo-title-simple">PopGo</h1>
                    <p class="popgo-subtitle-simple">Balon Patlatma Oyunu</p>
                </div>
            `;
            
            // Style ekle
            popgoSplash.style.cssText = `
                position: fixed;
                top: 0;
                left: 0;
                width: 100vw;
                height: 100vh;
                background: #ffffff;
                display: flex;
                justify-content: center;
                align-items: center;
                z-index: 10000;
                opacity: 0;
                transition: opacity 0.5s ease-in;
            `;
            
            document.body.appendChild(popgoSplash);
            
            // Animasyon başlat
            setTimeout(() => {
                popgoSplash.style.opacity = '1';
            }, 100);
            
            // PopGo splash'ı 3 saniye göster
            setTimeout(() => {
                popgoSplash.style.opacity = '0';
                setTimeout(() => {
                    document.body.removeChild(popgoSplash);
                    
                    // Artık oyunu başlat
                    const gameRoot = document.getElementById('game-root');
                    const startScreen = document.getElementById('startScreen');
                    
                    if (gameRoot) {
                        gameRoot.style.visibility = 'visible';
                        gameRoot.style.display = 'flex';
                        console.log('Game root gösterildi');
                    }
                    
                    if (startScreen) {
                        startScreen.style.display = 'flex';
                        console.log('Start screen gösterildi');
                    }
                    
                    // CRITICAL: Start game AFTER game-root is visible
                    setTimeout(() => {
                        try {
                            console.log('🎮 Initializing game after splash...');
                            if (typeof onResize === 'function') {
                                console.log('✅ onResize found, calling...');
                                onResize();
                                console.log('✅ Canvas initialized');
                            } else {
                                console.error('❌ onResize not found!');
                            }
                            if (typeof startGame === 'function') {
                                console.log('✅ startGame found, calling...');
                                startGame(true);
                                console.log('✅ Game started');
                            } else {
                                console.error('❌ startGame not found!');
                            }
                        } catch (e) {
                            console.error('❌ Game start failed:', e);
                            // Retry after 500ms
                            setTimeout(() => {
                                console.log('🔄 Retrying game start...');
                                if (typeof onResize === 'function') onResize();
                                if (typeof startGame === 'function') startGame(true);
                            }, 500);
                        }
                    }, 200); // Small delay after visibility change
                    
                    console.log('PopGo splash screen tamamlandı, oyun başladı');
                    // Bu noktada arka plan müziğini otomatik başlat
                    try {
                        if (window.bgmManager) {
                            console.log('[BGM] Auto-start from PopGo splash end');
                            const ctx = bgmManager.getContext ? bgmManager.getContext() : null;
                            if (ctx && ctx.state === 'suspended' && ctx.resume) {
                                ctx.resume().then(()=>console.log('[BGM] context resume ok')).catch((e)=>console.warn('[BGM] context resume fail', e));
                            }
                            // Eğer tarayıcı izin vermezse ilk kullanıcı etkileşiminde kilidi açmak için bilgi ver
                            if (ctx && ctx.state === 'suspended') {
                                console.warn('[BGM] Context still suspended, waiting for user gesture');
                            }
                            bgmManager.setEnabled(true);
                            bgmManager.ensureStarted();
                        } else {
                            console.warn('[BGM] bgmManager not found on window');
                        }
                    } catch (e) { console.warn('BGM auto-start error:', e); }
                }, 500);
            }, 3000);
        }
        
        // Sayfa yüklendiğinde splash screen'i başlat - Android uyumlu
        // Hem DOMContentLoaded hem de load eventi için güvenlik
        let splashInitialized = false;
        
        const startSplash = () => {
            if (!splashInitialized) {
                splashInitialized = true;
                console.log('🎬 Splash screen init çağrılıyor...');
                initializeSplashScreen();
            }
        };
        
        // Çoklu event listener - hangisi önce tetiklenirse
        document.addEventListener('DOMContentLoaded', startSplash);
        window.addEventListener('load', startSplash);
        
        // Capacitor hazır olduğunda da kontrol et
        document.addEventListener('deviceready', startSplash);
        
        // Backup timer - 2 saniye sonra zorla başlat
        setTimeout(() => {
            if (!splashInitialized) {
                console.warn('⚠️ Backup timer ile splash screen başlatılıyor');
                startSplash();
            }
        }, 2000);

        // Banner reklamları başlat (sadece web ortamında)
        window.addEventListener('load', function() {
            setTimeout(() => {
                try {
                    const isCapacitor = !!window.Capacitor || /Capacitor/i.test(navigator.userAgent);
                    if (!isCapacitor) {
                        (adsbygoogle = window.adsbygoogle || []).push({});
                        (adsbygoogle = window.adsbygoogle || []).push({});
                        console.log('Banner reklamları (web) başlatıldı');
                    } else {
                        console.log('Web AdSense native ortamda devre dışı');
                    }
                } catch (e) {
                    console.log('Banner reklam başlatılamadı:', e);
                }
            }, 2000); // 2 saniye gecikme ile
        });

        // 🔥 ANTI-SCROLL PROTECTION - Reklam sonrası scroll kaymasını engelle
        (function() {
            // Sayfa yüklendiğinde ve her zaman scroll pozisyonunu sıfırda tut
            function preventScroll() {
                window.scrollTo(0, 0);
                document.body.scrollTop = 0;
                document.documentElement.scrollTop = 0;
            }

            // Scroll eventi dinle ve hemen sıfırla
            window.addEventListener('scroll', preventScroll, { passive: false });
            document.addEventListener('scroll', preventScroll, { passive: false });

            // Touch hareketlerinde de kontrol et
            let touchStartY = 0;
            document.addEventListener('touchstart', function(e) {
                touchStartY = e.touches[0].clientY;
            }, { passive: true });

            document.addEventListener('touchmove', function(e) {
                const touchY = e.touches[0].clientY;
                const touchDiff = touchY - touchStartY;
                
                // Eğer sayfa en üstteyse ve yukarı kaydırma yapılıyorsa engelle
                if (window.scrollY === 0 && touchDiff > 0) {
                    e.preventDefault();
                }
            }, { passive: false });

            // Periyodik olarak kontrol et (reklam sonrası güvenlik)
            setInterval(preventScroll, 100);

            // Sayfa yüklendiğinde de çalıştır
            preventScroll();
            
            console.log('✅ Anti-scroll protection aktif');
        })();

        // Basit bir PWA kurulumunun parçası olarak service worker kaydı
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('service-worker.js')
                    .catch(err => console.error('Service Worker kaydı başarısız:', err));
            });
        }
    </script>
